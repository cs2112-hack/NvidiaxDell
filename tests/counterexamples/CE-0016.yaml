notes: 'S-8.1 boundary: contract signed exactly on the last day of employment is correctly
  included ($140,000); a contract signed the day after is correctly excluded (nil); S-8.2
  with commission already paid: gross-misconduct leaver with $40,000 already paid and a $140,000
  entitlement correctly yields $0 payable and does not claw back the $40,000, matching ''forfeits
  any commission not yet paid''; already-paid exceeding entitlement with no Churned Contract
  (this finding); Plan-Year filter for a leaver: contracts signed outside 1 Oct 2025 - 30
  Sep 2026 correctly excluded via S-2.3; S-5.1/S-5.3 cap correctly applied to the leaver''s
  entitlement before the already-paid subtraction'
