id: CE-0005
component: catala
fact_pattern: A Grade 3 Employee submits a complete 41-entry timesheet for the week. Base
  Hourly Rate 30.00. Only 41 hours were worked in total.
citations:
- EMP-ANNEX-C C-4.2
- EMP-ANNEX-C C-4.1
- EMP-ANNEX-C C-3.1
source_reasoning: 'Only 41 hours were worked, so no hour was worked in excess of 48 and C-4.2''s
  condition is false. The single hour beyond 40 attracts C-4.1''s 1.25: 1.25 x 30 = 37.50.
  The overpayment arose because one row had been stamped with an ordinal of 49 by an import,
  and the module read the label rather than the week. Because the other forty entries are
  the complete ordinary week, there is no reading of this input on which more than 41 hours
  were worked.'
