id: CE-0007
component: catala
fact_pattern: The Availability Percentage was below 99.90% in each of January, February and
  March 2024 (occurrence 1). The Customer did not serve a termination notice and that right
  lapsed on 30 April 2024. Service then met the Service Level for fifteen months. The Availability
  Percentage was then below 99.90% again in each of July, August and September 2025 (occurrence
  2) -- a fresh set of three consecutive failing Measurement Periods. The Customer served
  written notice of termination on 5 October 2025 and the position is assessed on 10 October
  2025. (The two clusters are more than twelve months apart, so only the three-consecutive-periods
  limb of L-6.1 is engaged; the rolling four-in-twelve limb is not.)
citations:
- MSA-SCH4 L-6.1
- MSA-SCH4 L-6.2
source_reasoning: L-6.1 gives a termination right wherever the Availability Percentage is
  below 99.90% in each of three consecutive Measurement Periods. July, August and September
  2025 are three such periods, so a right arose on the expiry of September 2025. L-6.2 requires
  that right to be exercised 'within 30 days after the end of the Measurement Period which
  gives rise to it, failing which it lapses IN RESPECT OF THAT OCCURRENCE'. The Measurement
  Period giving rise to the right the Customer is exercising is September 2025, which ended
  30 September 2025; the deadline is therefore 30 October 2025 and notice served on 5 October
  2025 is in time. The closing words of L-6.2 ('in respect of that occurrence') confine the
  lapse to the occurrence whose window expired -- the March 2024 occurrence -- and expressly
  preserve any later occurrence. The module instead takes trigger_period_end as the MINIMUM
  period_end over all completing periods, i.e. the earliest occurrence ever recorded, derives
  one global exercise_deadline from it (2024-04-30) and then sets a single global right_lapsed.
  The lapse of occurrence 1 therefore destroys the right arising from occurrence 2, which
  is precisely what the words 'in respect of that occurrence' forbid. The customer loses a
  right to terminate without early termination charges.
