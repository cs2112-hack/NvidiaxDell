notes: relief that terminates in pence (e.g. 73 days on GBP 730,000 - exact, no discrepancy);
  rounding that goes down rather than up (cannot be made to straddle a band boundary at whole-penny
  Net Booked Revenue); the same construction at the 100% and 150% band boundaries (reachable
  but the 50% boundary is the starkest, 0.0 vs 1.0); S-5.3's 200% boundary (cap only, smaller
  effect)
