id: CE-0021
component: catala
fact_pattern: 'An Employee of Grade 1 with a Base Hourly Rate of GBP 20.10 works 40 hours
  in a Payroll Week, every one of them a Night Hour (C-2.3), and receives no standing shift
  allowance. No hour is worked on a Gazetted Public Holiday and none is Critical Incident
  Response. No hour exceeds 40, so nothing is payable under C-4. The only sum payable is the
  C-6.1 night premium: 0.15 x GBP 20.10 = GBP 3.015 for each of the 40 Night Hours, i.e. GBP
  120.60 for the week.'
citations:
- EMP-ANNEX-C C-6.1
- EMP-ANNEX-C C-6.2
- EMP-ANNEX-C C-2.1
- EMP-ANNEX-C C-3.1
- EMP-ANNEX-C C-4.1
- EMP-ANNEX-C C-8.2
source_reasoning: 'C-6.1 fixes the premium as ''0.15 times the Base Hourly Rate ... in respect
  of each Night Hour worked''. C-6.2 does not disapply it (no standing shift allowance). C-3.1/C-4.1
  contribute nothing because no hour exceeds 40, and C-8.2 confirms the night premium stands
  alone and cumulatively. The quantity C-6.1 makes payable is therefore the sum over 40 hours
  of 0.15 x GBP 20.10. 0.15 x 20.10 = 3.015 exactly, and 40 x 3.015 = GBP 120.60 exactly -
  a sum expressible to the penny, so no rounding of the total is required or permitted. The
  module instead converts each hour''s entitlement to money separately, rounding 3.015 up
  to GBP 3.02 forty times, and sums the rounded amounts to GBP 120.80. Nothing in C-6.1 authorises
  rounding the per-hour premium; the clause states a rate, and the payable sum is the aggregate
  of the rated hours. Rounding does not commute with summation (PROTOCOL strategy 4): the
  module''s order of operations overpays by GBP 0.20 on this week, a 0.17% error that scales
  with the number of hours. The same defect is reproducible under C-4.1 alone: 48 plain hours
  at the same rate give 8 x 1.25 x 20.10 = GBP 201.00 exactly, and the module returns GBP
  201.04.'
