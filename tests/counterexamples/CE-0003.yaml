id: CE-0003
component: catala
fact_pattern: A Grade 3 Employee works 50 hours in one Payroll Week, recorded as five days
  of ten hours with the hours numbered within each day rather than across the week. Base Hourly
  Rate 30.00.
citations:
- EMP-ANNEX-C C-4.1
- EMP-ANNEX-C C-4.2
- EMP-ANNEX-C C-3.1
- EMP-ANNEX-C C-2.2
source_reasoning: 'C-4.1 confers the entitlement on each hour worked in excess of 40 hours
  in a Payroll Week -- a fact about the week, not a label on a timesheet row. Ten hours were
  worked in excess of 40. C-4.2 then takes the two hours in excess of 48 at 1.5, leaving eight
  at C-4.1''s 1.25: 8 x 1.25 x 30 + 2 x 1.5 x 30 = 390.00. NOTE ON THE EXPECTED VALUE: the
  reviewer that found this stated 375.00 (10 x 1.25 x 30), which omits C-4.2 entirely. The
  break is real and the observed 0.00 is real, but the reviewer''s arithmetic was wrong, so
  the expected value recorded here is 390.00, derived from C-4.1 and C-4.2 together. A counterexample
  is only worth keeping if its expectation is right.'
expected:
  overtime_payment: 390.0
  toil_hours: 0.0
observed:
  overtime_payment: 0.0
  toil_hours: 0.0
