id: CE-0022
component: catala
fact_pattern: 'An Employee of Grade 1 with a Base Hourly Rate of GBP 20.10 works 48 hours
  in a Payroll Week. No hour is a Night Hour, none is worked on a Gazetted Public Holiday
  and none is Critical Incident Response. Eight hours are worked in excess of 40 and none
  in excess of 48, so C-4.1 alone applies to the overtime: 8 hours at 1.25 x GBP 20.10.'
citations:
- EMP-ANNEX-C C-4.1
- EMP-ANNEX-C C-4.2
- EMP-ANNEX-C C-3.1
- EMP-ANNEX-C C-2.1
source_reasoning: 'Derived end to end. C-3.1 puts the ordinary week at 40 hours, so 8 of the
  48 hours are ''in excess of 40 hours in a Payroll Week'' within C-4.1 and each is ''calculated
  at 1.25 times the Base Hourly Rate''. C-4.2 is checked and does NOT engage: 48 is not in
  excess of 48, so no hour attracts 1.5. C-5 is irrelevant (Grade 1 < 5) and C-7 is irrelevant
  (no Gazetted Public Holiday), so C-8.1 has nothing to rank. The sum C-4.1 makes payable
  is 8 x 1.25 x GBP 20.10 = 10 x GBP 20.10 = GBP 201.00 exactly, expressible to the penny.
  The module rounds each hour''s 1.25 x 20.10 = GBP 25.125 to GBP 25.13 before summing, yielding
  8 x 25.13 = GBP 201.04. C-4.1 states a rate per hour and says nothing about converting each
  hour separately to the nearest penny; the entitlement is the aggregate of the rated hours,
  and the aggregate is exact. Same root cause as the C-6.1 finding, but it bites on a different
  clause and a different fact pattern, so it is recorded separately.'
