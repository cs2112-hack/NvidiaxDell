id: CE-0008
component: catala
fact_pattern: The Availability Percentage was below 99.90% in July, August and September 2025,
  so a chronic-failure right arose on the expiry of September 2025. The only written notice
  the Customer ever served was dated 15 August 2025 -- served in the middle of the failing
  run, before the third consecutive period had even ended and therefore before any right existed.
  No notice was served in October 2025. The position is assessed on 1 December 2025, i.e.
  after the 30-day exercise window (which closed on 30 October 2025) has expired.
citations:
- MSA-SCH4 L-6.1
- MSA-SCH4 L-6.2
source_reasoning: 'L-6.1 makes the right conditional on the Availability Percentage being
  below 99.90% ''in each of three consecutive Measurement Periods''. The third of those periods,
  September 2025, did not end until 30 September 2025, so no right existed on 15 August 2025
  and the notice of that date cannot be an exercise of it. L-6.2 then fixes the window: the
  right ''must be exercised WITHIN 30 DAYS AFTER THE END of the Measurement Period which gives
  rise to it''. That window is 30 September 2025 to 30 October 2025; 15 August 2025 falls
  outside it because it is not ''after the end'' of September 2025 at all. No exercise having
  occurred inside the window, L-6.2''s ''failing which it lapses'' bites and, as at the 1
  December 2025 assessment date, the right has lapsed. The module''s lapse rule is ''if notice_given
  then notice_date > deadline else assessment_date > deadline'': it tests only the upper bound
  of the window and, once notice_given is true, stops looking at assessment_date altogether.
  Any notice bearing a date on or before the deadline -- including one predating the right,
  or predating the Agreement -- is treated as a good exercise, and the right is reported as
  still exercisable indefinitely. The Supplier is exposed to a termination without early termination
  charges on the strength of a notice that L-6.2 does not recognise.'
