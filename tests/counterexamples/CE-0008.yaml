notes: 'L-6.1 consecutive trigger: three consecutive failing periods (Jul-Sep 2025) -- fires
  correctly; L-6.1 rolling trigger alone: failures Jan/Apr/Jul/Oct 2025, no three consecutive
  -- rolling_trigger true, consecutive_trigger false, correct; L-6.1 neither-but-close: failures
  Jan/Feb/Apr 2025 (three failures, not consecutive, only three in the window) -- right_arisen
  false, correct; L-6.1 rolling window at exactly twelve months: failures Jan/Jun/Sep/Dec
  2025 (12-calendar-month span) -- triggers, correct; L-6.1 rolling window at thirteen months:
  failures Dec 2024/Jun/Sep/Dec 2025 -- does not trigger, correct; L-6.2 day 30 with notice
  (notice 2025-10-30 on a 2025-09-30 trigger) -- not lapsed, correct; L-6.2 day 31 with notice
  (notice 2025-10-31) -- lapsed, correct; L-6.2 day 30 / day 31 with no notice, judged by
  assessment_date -- correct both sides; L-6.2 two separate occurrences (BREAK); L-6.2 notice
  dated before the right arose (BREAK); 99.90% threshold on availability_percentage: 99.90
  is not a failing period, 99.89 is'
