id: CE-0002
component: catala
fact_pattern: A Grade 5 Employee on a Base Hourly Rate of 30.00 works 45 hours in a Payroll
  Week. Hours 41 to 45 are worked on a Gazetted Public Holiday. None of the hours is Critical
  Incident Response or a Night Hour, and the Employee receives no standing shift allowance.
  The question is the week's overtime payment and time-off-in-lieu accrual.
citations:
- EMP-ANNEX-C C-3.1
- EMP-ANNEX-C C-5.1
- EMP-ANNEX-C C-5.2
- EMP-ANNEX-C C-7.1
- EMP-ANNEX-C C-8.1
source_reasoning: 'Five hours are worked in excess of the 40-hour ordinary week fixed by C-3.1,
  namely hours 41-45, and each is worked on a Gazetted Public Holiday. On the payment side
  C-7.1 fixes each at 2.0 times the Base Hourly Rate and, via C-8.1, 2.0 is the highest applicable
  multiplier, so the payment is 5 x 2.0 x 30.00 = 300.00 - which the module gets right. On
  the accrual side C-5.1 gives the Grade 5 Employee one hour of time off in lieu for each
  of those same five hours in excess of 40. Nothing displaces that accrual: C-5.2 is confined
  to Critical Incident Response hours and none of these is; C-7.1 substitutes its rate only
  for ''any amount otherwise payable under C-4'', which does not describe a leave accrual
  arising under C-5.1; and C-8.1 governs only which multiplier applies. The week therefore
  accrues 5.0 TOIL hours. The module returns 0.0. The identical week with the public-holiday
  flag removed returns toil_hours 5.0, which isolates the defect precisely: the module treats
  a Gazetted Public Holiday as extinguishing the C-5.1 accrual, a consequence Annex C nowhere
  provides for. Because the aggregate is a straight sum over hours, the per-hour error scales
  - a Grade 5 Employee who works a whole week of public-holiday overtime loses the entire
  accrual.'
expected:
  overtime_payment: 300.0
  toil_hours: 5.0
observed:
  overtime_payment: 300.0
  toil_hours: 0.0
target:
