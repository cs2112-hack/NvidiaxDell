_comment: |
  Routing evaluation set for the chat layer.

  Every label here is derived from the corpus text and the triage decisions, not
  from what the router currently does. A case is written by reading the clause,
  deciding which engine can honestly answer, and recording the clause refs a
  correct answer must cite. Where the clause is RULE or HYBRID the engine is
  CATALA and the answer comes from executing a scope; where it is PROSE the
  engine is VECTOR and the answer is a verbatim quotation; where the corpus does
  not address the question at all the engine is NONE.

  Fields
  ------
  id         stable identifier, referenced by eval/BASELINE.md and the harness
  question   what a user of this corpus would actually type
  engine     CATALA | VECTOR | BOTH | NONE  (see "engine semantics" below)
  scope      the scope that should answer. A list means any member is correct:
             either because two scopes legitimately answer the same question, or
             -- with `ambiguous: true` -- because the router SHOULD report the
             candidates rather than pick one.
  ambiguous  true where naming a single scope would be a guess. Reporting the
             candidate list is the CORRECT behaviour for these, not a failure.
  clauses    clause refs a correct answer must cite. Checked against the clause
             text: a ref is listed only where that clause really says the thing.
  judgement  scope inputs that are a judgement the documents do not define. The
             system must say a human supplies them and must not decide them.
  pair       near-miss pairs. Two cases sharing a `pair` differ by roughly one
             word and must route differently. Listed so a change that helps one
             at the cost of the other is visible.
  tags       category, for the per-category breakdown
  why        one line, from the clause text

  Engine semantics
  ----------------
  The engine of an answer is the set of engines that contribute SUBSTANTIVE
  parts. A CATALA part of any kind (computed, needs-input, ambiguous-route,
  error, refused) contributes CATALA. A VECTOR part of kind `quotation`
  contributes VECTOR. Parts of kind `caveat` are excluded: caveats are attached
  automatically to every executed module that has qualifying prose, so they are
  determined by triage's `qualifies` field and carry no routing signal. The
  harness reports caveat counts separately.

  CATALA covers the needs-input case. "How much overtime am I owed?" with no
  hours supplied is answered correctly by naming the scope and its inputs; that
  is a CATALA answer, not a failure to answer.

  BOTH is reserved for questions with a genuine computational part AND a genuine
  prose part -- not for a rule answer that happens to carry prose caveats.

cases:

# ---------------------------------------------------------------------------
# Plainly computational. A scope executes and produces the figure.
# ---------------------------------------------------------------------------

- id: C-001
  question: "What is the Base Hourly Rate for an employee on an annual base salary of 52000?"
  engine: CATALA
  scope: WorkingTimeDefs.BaseHourlyRate
  clauses: ["EMP-ANNEX-C C-2.1"]
  tags: [computational]
  why: "C-2.1 defines Base Hourly Rate as annual base salary divided by 2,080 -- pure arithmetic."

- id: C-002
  question: "An employee works 52 hours in a payroll week on grade 3. What overtime payment is due?"
  engine: CATALA
  scope: [Overtime.WeeklyOvertime, Overtime.HourPremium]
  clauses: ["EMP-ANNEX-C C-4.1", "EMP-ANNEX-C C-4.2"]
  tags: [computational]
  why: "C-4.1 pays 1.25x above 40 hours and C-4.2 pays 1.5x above 48; a weekly total is the aggregate over hours."

- id: C-003
  question: "What multiplier applies to the 49th hour worked in a payroll week?"
  engine: CATALA
  scope: Overtime.HourPremium
  clauses: ["EMP-ANNEX-C C-4.2"]
  tags: [computational]
  why: "C-4.2 is the exception to C-4.1 for hours in excess of 48, at 1.5 times Base Hourly Rate."

- id: C-004
  question: "What multiplier applies to the 45th hour worked in a payroll week?"
  engine: CATALA
  scope: Overtime.HourPremium
  clauses: ["EMP-ANNEX-C C-4.1"]
  tags: [computational]
  why: "C-4.1 applies 1.25x to each hour in excess of 40; 45 is above 40 but not above 48."

- id: C-005
  question: "Is an employee on grade 5 entitled to an overtime payment?"
  engine: CATALA
  scope: Overtime.HourPremium
  clauses: ["EMP-ANNEX-C C-5.1"]
  tags: [computational]
  why: "C-5.1 removes the overtime payment for grade 5 and above and substitutes time off in lieu."

- id: C-006
  question: "Is an employee on grade 5 paid overtime for hours worked on Critical Incident Response?"
  engine: CATALA
  scope: Overtime.HourPremium
  clauses: ["EMP-ANNEX-C C-5.2"]
  tags: [computational]
  why: "C-5.2 is the notwithstanding exception to C-5.1 restoring the C-4 payment for incident response hours."

- id: C-007
  question: "What rate is payable for an hour worked on a Gazetted Public Holiday?"
  engine: CATALA
  scope: Overtime.HourPremium
  clauses: ["EMP-ANNEX-C C-7.1"]
  tags: [computational]
  pair: PH
  why: "C-7.1 sets 2.0 times Base Hourly Rate in substitution for any C-4 amount."

- id: C-008
  question: "What is a Gazetted Public Holiday?"
  engine: CATALA
  scope: WorkingTimeDefs.GazettedPublicHolidays
  clauses: ["EMP-ANNEX-C C-2.6"]
  tags: [computational, definition]
  pair: PH
  why: "C-2.6 defines it by reference to the principal place of work; the scope decides it for a given day."

- id: C-009
  question: "Hours on a public holiday are also above 48 in the week. What rate applies?"
  engine: CATALA
  scope: Overtime.HourPremium
  clauses: ["EMP-ANNEX-C C-7.2"]
  tags: [computational]
  why: "C-7.2 takes the greater of 2.0x and the C-4.2 rate plus 0.25 where both limbs bite."

- id: C-010
  question: "Is the night premium payable to an employee who receives a standing shift allowance?"
  engine: CATALA
  scope: Overtime.HourPremium
  clauses: ["EMP-ANNEX-C C-6.2"]
  tags: [computational]
  why: "C-6.2 is the exception to C-6.1 disapplying the premium where a standing shift allowance is paid."

- id: C-011
  question: "Is the night premium added on top of the public holiday rate or replaced by it?"
  engine: CATALA
  scope: Overtime.HourPremium
  clauses: ["EMP-ANNEX-C C-8.2"]
  tags: [computational]
  why: "C-8.2 exempts the C-6 night premium from the single-highest-multiplier rule in C-8.1, so it is cumulative."

- id: C-012
  question: "Two overtime provisions apply to the same hour. Do they stack?"
  engine: CATALA
  scope: Overtime.HourPremium
  clauses: ["EMP-ANNEX-C C-8.1"]
  tags: [computational]
  why: "C-8.1 allows only the single highest applicable multiplier across C-4, C-5 and C-7."

- id: C-013
  question: "Is an hour beginning at 23:00 a Night Hour?"
  engine: CATALA
  scope: WorkingTimeDefs.NightHours
  clauses: ["EMP-ANNEX-C C-2.3"]
  tags: [computational, definition]
  why: "C-2.3 defines Night Hours as 22:00 to 06:00 the following day."

- id: C-014
  question: "Which payroll week does Wednesday 5 March 2025 fall in?"
  engine: CATALA
  scope: WorkingTimeDefs.PayrollWeekOf
  clauses: ["EMP-ANNEX-C C-2.2"]
  tags: [computational, definition]
  why: "C-2.2 defines the Payroll Week as the seven days from 00:00 Monday, so the week is derived from the date."

- id: C-015
  question: "Which grade applies if an employee is regraded mid-week?"
  engine: CATALA
  scope: WorkingTimeDefs.GradeForPayrollWeek
  clauses: ["EMP-ANNEX-C C-2.4"]
  tags: [computational]
  why: "C-2.4 fixes Grade as recorded at the first day of the Payroll Week in question."

- id: C-016
  question: "How many days of annual leave accrue for a completed calendar month of service?"
  engine: CATALA
  scope: LeaveAccrual.MonthlyAccrual
  clauses: ["EMP-ANNEX-C C-9.1"]
  tags: [computational]
  why: "C-9.1 sets the accrual rate at 2.0 days per completed calendar month."

- id: C-017
  question: "How is leave accrual pro-rated for an employee who starts on the 12th of the month?"
  engine: CATALA
  scope: LeaveAccrual.MonthlyAccrual
  clauses: ["EMP-ANNEX-C C-9.2"]
  tags: [computational]
  why: "C-9.2 pro-rates by days of service over days in the month, rounded to the nearest half day."

- id: C-018
  question: "How many accrued but untaken days can be carried forward to the next leave year?"
  engine: CATALA
  scope: LeaveAccrual.CarryForward
  clauses: ["EMP-ANNEX-C C-9.3"]
  tags: [computational]
  why: "C-9.3 caps ordinary carry-forward at 5 accrued but untaken days."

- id: C-019
  question: "Is leave forfeited at the end of the leave year payable on termination?"
  engine: CATALA
  scope: LeaveAccrual.CarryForward
  clauses: ["EMP-ANNEX-C C-9.5"]
  tags: [computational]
  why: "C-9.5 forfeits the excess and states it is not payable on termination."

- id: C-020
  question: "What is the meal per diem in a Tier 1 city?"
  engine: CATALA
  scope: MealPerDiem.MealPerDiemForDay
  clauses: ["EXP-POL E-3.1"]
  tags: [computational]
  pair: TIER1
  why: "E-3.1(a) sets 75 pounds per Travel Day for a Tier 1 city."

- id: C-021
  question: "What is the accommodation cap in a Tier 1 city?"
  engine: CATALA
  scope: Accommodation.NightlyAccommodation
  clauses: ["EXP-POL E-4.1"]
  tags: [computational]
  pair: TIER1
  why: "E-4.1 caps accommodation at 220 pounds per night in a Tier 1 city -- a different scope from the per diem."

- id: C-022
  question: "The travel is Client-Billable and the statement of work says nothing about per diem. What applies?"
  engine: CATALA
  scope: MealPerDiem.MealPerDiemForDay
  clauses: ["EXP-POL E-3.2"]
  tags: [computational]
  why: "E-3.2 applies 1.5 times the E-3.1 amount where the SOW specifies none."

- id: C-023
  question: "Two free meals were provided at a conference. How is the per diem reduced?"
  engine: CATALA
  scope: MealPerDiem.MealPerDiemForDay
  clauses: ["EXP-POL E-3.4"]
  tags: [computational]
  why: "E-3.4 reduces the per diem by 15 pounds in respect of each meal provided at no cost."

- id: C-024
  question: "Is a per diem payable for a Travel Day on which no meal expense was incurred?"
  engine: CATALA
  scope: MealPerDiem.MealPerDiemForDay
  clauses: ["EXP-POL E-3.5"]
  tags: [computational]
  why: "E-3.5 pays no per diem for a Travel Day with no meal expense."

- id: C-025
  question: "How much extra per diem applies while on Critical Incident Response?"
  engine: CATALA
  scope: MealPerDiem.MealPerDiemForDay
  clauses: ["EXP-POL E-7.2"]
  tags: [computational]
  why: "E-7.2 increases the E-3.1 per diem by 20 pounds per Travel Day and waives Pre-Approval for the increase."

- id: C-026
  question: "How many Travel Days are there if I leave on 3 June and return on 6 June?"
  engine: CATALA
  scope: ExpenseDefs.TravelDayCount
  clauses: ["EXP-POL E-2.3"]
  tags: [computational, definition]
  why: "E-2.3 counts each calendar day or part day away overnight, including both departure and return days."

- id: C-027
  question: "Are local taxes and a mandatory city charge inside or outside the accommodation cap?"
  engine: CATALA
  scope: Accommodation.NightlyAccommodation
  clauses: ["EXP-POL E-4.3"]
  tags: [computational]
  why: "E-4.3 makes the caps inclusive of local taxes and mandatory resort or city charges, and exclusive of parking."

- id: C-028
  question: "Is a standard class rail ticket reimbursable?"
  engine: CATALA
  scope: GroundTransport.RailFare
  clauses: ["EXP-POL E-5.1"]
  tags: [computational]
  why: "E-5.1 reimburses standard class rail travel at actual cost."

- id: C-029
  question: "Is a first class rail ticket reimbursable?"
  engine: CATALA
  scope: GroundTransport.RailFare
  clauses: ["EXP-POL E-5.2"]
  tags: [computational]
  why: "E-5.2 allows first class only where it does not exceed the same-day standard fare, or Pre-Approval was obtained."

- id: C-030
  question: "How much of an 80 pound taxi fare is reimbursable?"
  engine: CATALA
  scope: GroundTransport.TaxiFare
  clauses: ["EXP-POL E-5.3"]
  tags: [computational]
  why: "E-5.3 caps private hire and taxi journeys at 60 pounds per journey."

- id: C-031
  question: "Is an airport taxi at 04:30 reimbursable without limit?"
  engine: CATALA
  scope: GroundTransport.TaxiFare
  clauses: ["EXP-POL E-5.3"]
  tags: [computational]
  why: "E-5.3 lifts the 60 pound cap for an airport journey before 06:00 or after 22:00."

- id: C-032
  question: "What is a valid Pre-Approval for an expense?"
  engine: CATALA
  scope: ExpenseDefs.PreApprovalValid
  clauses: ["EXP-POL E-2.4"]
  tags: [computational, definition]
  why: "E-2.4 requires written approval obtained before the expense from a person with authority at or above the amount."

- id: C-033
  question: "How many days do I have to submit an expense claim?"
  engine: CATALA
  scope: ClaimWindow.ClaimAdmissible
  clauses: ["EXP-POL E-6.1"]
  tags: [computational]
  pair: DEADLINE
  why: "E-6.1 requires submission within 60 days after the date the expense was incurred."

- id: C-034
  question: "How many days do I have to claim a service credit?"
  engine: CATALA
  scope: ServiceCreditClaim.CreditClaim
  clauses: ["MSA-SCH4 L-5.1"]
  tags: [computational]
  pair: DEADLINE
  why: "L-5.1 requires a written claim within 30 days after the end of the Measurement Period -- a different scope."

- id: C-034b
  question: "Can an expense claim submitted 130 days after the expense be reimbursed?"
  engine: CATALA
  scope: ClaimWindow.ClaimAdmissible
  clauses: ["EXP-POL E-6.3"]
  tags: [computational]
  why: "E-6.3 bars any claim submitted more than 120 days after the expense, in any circumstances."

- id: C-035
  question: "What is my Attainment if Net Booked Revenue is 1.2 million against a 1 million quota?"
  engine: CATALA
  scope: Commission.Attainment
  clauses: ["COMM-PLAN S-2.2"]
  tags: [computational]
  why: "S-2.2 defines Attainment as Net Booked Revenue expressed as a percentage of Quota."

- id: C-036
  question: "What accelerator applies at 160% Attainment?"
  engine: CATALA
  scope: Commission.Accelerator
  clauses: ["COMM-PLAN S-4.1"]
  tags: [computational]
  why: "S-4.1(d) sets an accelerator of 2.0 at Attainment of 150% or more."

- id: C-037
  question: "Does the accelerator apply only to revenue above the threshold?"
  engine: CATALA
  scope: [Commission.Accelerator, Commission.CommissionPayable]
  clauses: ["COMM-PLAN S-4.2"]
  tags: [computational]
  why: "S-4.2 applies the accelerator to the whole of Net Booked Revenue, not only the portion above the threshold."

- id: C-038
  question: "What is the accelerator cap for an employee who joined part way through the Plan Year?"
  engine: CATALA
  scope: Commission.Accelerator
  clauses: ["COMM-PLAN S-4.4"]
  tags: [computational]
  why: "S-4.4 caps the accelerator at 1.5 for the Plan Year in which the employee commenced."

- id: C-039
  question: "What is the cap on total commission as a percentage of base salary?"
  engine: CATALA
  scope: Commission.CommissionPayable
  clauses: ["COMM-PLAN S-5.1"]
  tags: [computational]
  why: "S-5.1 caps total commission for the Plan Year at 250% of annual base salary."

- id: C-040
  question: "What is the commission cap where Attainment exceeds 200%?"
  engine: CATALA
  scope: Commission.CommissionPayable
  clauses: ["COMM-PLAN S-5.3"]
  tags: [computational]
  why: "S-5.3 is the exception to S-5.1 raising the cap to 400% of annual base salary."

- id: C-041
  question: "Is the commission cap applied before or after the accelerator?"
  engine: CATALA
  scope: Commission.CommissionPayable
  clauses: ["COMM-PLAN S-5.2"]
  tags: [computational]
  why: "S-5.2 applies the cap after the S-4 accelerator and after any S-6 adjustment."

- id: C-042
  question: "Is a customer a New Logo if it had a contract 30 months ago?"
  engine: CATALA
  scope: Commission.NewLogo
  clauses: ["COMM-PLAN S-2.6"]
  tags: [computational, definition]
  why: "S-2.6 requires no contract at any time in the 24 months preceding the signature date."

- id: C-043
  question: "Is a contract not renewed at its first renewal date 150 days after signature a Churned Contract?"
  engine: CATALA
  scope: Commission.ChurnedContract
  clauses: ["COMM-PLAN S-2.4"]
  tags: [computational, definition]
  why: "S-2.4 covers termination by the customer or non-renewal at first renewal within 180 days of signature."

- id: C-044
  question: "How is Net Booked Revenue calculated?"
  engine: CATALA
  scope: Commission.NetBookedRevenue
  clauses: ["COMM-PLAN S-2.3"]
  tags: [computational]
  why: "S-2.3 aggregates annual contract value of contracts signed in the Plan Year less the ACV of Churned Contracts."

- id: C-045
  question: "When is Quota assigned to an employee who joins mid-year?"
  engine: CATALA
  scope: Commission.AssignedQuota
  clauses: ["COMM-PLAN S-2.1"]
  tags: [computational]
  why: "S-2.1 sets Quota in writing at the start of the Plan Year, or on joining if later."

- id: C-046
  question: "How much quota relief is given for 45 days of long-term sickness absence?"
  engine: CATALA
  scope: [QuotaRelief.RelievedQuota, QuotaRelief.QualifyingAbsence]
  clauses: ["COMM-PLAN S-6.1"]
  tags: [computational]
  why: "S-6.1 reduces Quota by 1/365th of the annual Quota for each day of a qualifying absence of 30 days or more."

- id: C-047
  question: "Is commission payable to an employee dismissed for gross misconduct?"
  engine: CATALA
  scope: Commission.LeaverCommission
  clauses: ["COMM-PLAN S-8.2"]
  tags: [computational]
  pair: LEAVE
  why: "S-8.2 forfeits any commission not yet paid where employment is terminated for gross misconduct."

- id: C-048
  question: "Is commission payable to a leaver on contracts signed before their last day?"
  engine: CATALA
  scope: Commission.LeaverCommission
  clauses: ["COMM-PLAN S-8.1"]
  tags: [computational]
  pair: LEAVE
  why: "S-8.1 entitles a leaver to commission on contracts signed on or before their last day of employment."

- id: C-049
  question: "Can commission paid 30 months ago be clawed back?"
  engine: CATALA
  scope: Clawback.RecoverableCommission
  clauses: ["COMM-PLAN S-7.3"]
  tags: [computational]
  why: "S-7.3 bars recovery more than 24 months after the date the commission was paid."

- id: C-050
  question: "A contract has churned. Can the Company recover the commission paid on it?"
  engine: CATALA
  scope: Clawback.RecoverableCommission
  clauses: ["COMM-PLAN S-7.1"]
  tags: [computational]
  pair: CHURN
  why: "S-7.1 permits recovery of commission attributable to a contract that becomes a Churned Contract."

- id: C-051
  question: "What Service Credit is payable at an Availability Percentage of 98.50%?"
  engine: CATALA
  scope: ServiceCredits.ServiceCredit
  clauses: ["MSA-SCH4 L-4.1"]
  tags: [computational]
  why: "L-4.1(c) gives 20% of the Monthly Service Charge for less than 99.00% but not less than 98.00%."

- id: C-052
  question: "What Service Credit is payable at an Availability Percentage of 94.00%?"
  engine: CATALA
  scope: ServiceCredits.ServiceCredit
  clauses: ["MSA-SCH4 L-4.3"]
  tags: [computational]
  why: "L-4.3 sets the credit and the cap at 50% of the Monthly Service Charge below 95.00%."

- id: C-053
  question: "What is the maximum aggregate Service Credit for a Measurement Period?"
  engine: CATALA
  scope: ServiceCredits.ServiceCredit
  clauses: ["MSA-SCH4 L-4.2"]
  tags: [computational]
  pair: REMEDY
  why: "L-4.2 caps the aggregate credit at 30% of the Monthly Service Charge."

- id: C-054
  question: "What is the committed Availability Percentage under the Service Level?"
  engine: CATALA
  scope: [Availability.AvailabilityPercentage, Availability.ServiceAvailability]
  clauses: ["MSA-SCH4 L-3.1"]
  tags: [computational]
  why: "L-3.1 requires the Availability Percentage in each Measurement Period to be not less than 99.90%."

- id: C-055
  question: "What is the Monthly Service Charge if professional services and pass-through charges are billed too?"
  engine: CATALA
  scope: ServiceCredits.MonthlyServiceCharge
  clauses: ["MSA-SCH4 L-2.7"]
  tags: [computational]
  why: "L-2.7 excludes one-off, professional services and pass-through charges from the Monthly Service Charge."

- id: C-056
  question: "How is the Availability Percentage calculated and rounded?"
  engine: CATALA
  scope: Availability.AvailabilityPercentage
  clauses: ["MSA-SCH4 L-2.3"]
  tags: [computational]
  why: "L-2.3 gives the formula and requires rounding to two decimal places."

- id: C-057
  question: "What is a Measurement Period?"
  engine: CATALA
  scope: Availability.MeasurementPeriod
  clauses: ["MSA-SCH4 L-2.1"]
  tags: [computational, definition]
  why: "L-2.1 defines the Measurement Period as each calendar month; the scope derives its end and total minutes."

- id: C-058
  question: "When is the Service Available for the purposes of the SLA?"
  engine: CATALA
  scope: Availability.RequestAvailable
  clauses: ["MSA-SCH4 L-2.2"]
  tags: [computational, definition]
  why: "L-2.2 defines Available as responding to a well-formed request at the documented endpoint within the latency threshold."

- id: C-059
  question: "Emergency maintenance was notified 30 minutes in advance. Are those minutes excluded?"
  engine: CATALA
  scope: Availability.ExcludedMinutes
  clauses: ["MSA-SCH4 L-2.5"]
  tags: [computational]
  why: "L-2.5(b) excludes emergency maintenance only where at least 60 minutes' notice was given."

- id: C-060
  question: "Scheduled maintenance ran to 10 hours this month. What happens to the excess 2 hours?"
  engine: CATALA
  scope: [Availability.ScheduledMaintenance, Availability.AvailabilityPercentage]
  clauses: ["MSA-SCH4 L-4.5"]
  tags: [computational]
  why: "L-4.5 makes minutes above the 8 hour aggregate count as Unavailable Minutes rather than Excluded Minutes."

- id: C-061
  question: "How many Business Days notice does Scheduled Maintenance need?"
  engine: CATALA
  scope: [Availability.ScheduledMaintenanceWindow, Availability.ScheduledMaintenance]
  clauses: ["MSA-SCH4 L-2.6"]
  tags: [computational]
  pair: NOTICE
  why: "L-2.6 requires a window notified not less than 5 Business Days in advance."

- id: C-062
  question: "When is the Service Credit paid if no further invoice will be issued?"
  engine: CATALA
  scope: ServiceCreditClaim.CreditClaim
  clauses: ["MSA-SCH4 L-5.2"]
  tags: [computational]
  why: "L-5.2 pays the credit to the Customer within 30 days where no further invoice will be issued."

- id: C-063
  question: "Availability was below 99.90% in three consecutive months. Can we terminate?"
  engine: CATALA
  scope: ChronicFailure.ChronicFailureRight
  clauses: ["MSA-SCH4 L-6.1"]
  tags: [computational]
  why: "L-6.1 gives a right to terminate the affected Service on 30 days' notice on three consecutive failing periods."

- id: C-064
  question: "How long does the chronic failure termination right stay exercisable?"
  engine: CATALA
  scope: ChronicFailure.ChronicFailureRight
  clauses: ["MSA-SCH4 L-6.2"]
  tags: [computational]
  why: "L-6.2 requires exercise within 30 days after the end of the Measurement Period giving rise to it, or it lapses."

- id: C-065
  question: "How much notice is needed to terminate the NDA early?"
  engine: CATALA
  scope: NdaSurvival.SurvivalEnd
  clauses: ["NDA-MUT N-5.1"]
  tags: [computational]
  pair: NOTICE
  why: "N-5.1 allows termination on 30 days' written notice within the 2 year term."

- id: C-066
  question: "How long do the confidentiality obligations survive termination of the NDA?"
  engine: CATALA
  scope: NdaSurvival.SurvivalEnd
  clauses: ["NDA-MUT N-5.2"]
  tags: [computational]
  pair: SURVIVE
  why: "N-5.2 continues the N-3 obligations for 3 years from expiry or termination."

- id: C-067
  question: "How long do confidentiality obligations last for personal data?"
  engine: CATALA
  scope: NdaSurvival.SurvivalEnd
  clauses: ["NDA-MUT N-5.4"]
  tags: [computational]
  why: "N-5.4 continues the obligations for so long as the Recipient holds the personal data."

- id: C-068
  question: "How long is an Employee Record retained?"
  engine: CATALA
  scope: Retention.RetentionEnd
  clauses: ["DATA-RET R-3.1"]
  tags: [computational]
  why: "R-3.1(a) retains an Employee Record for 6 years from the end of employment."

- id: C-069
