diagnostic: ''
narrative: A customer account shows 94.9% availability, triggering the 50% credit under L-4.3.
  The customer is 31 days in arrears on an undisputed invoice, triggering the exclusion under
  L-4.4. The documents do not specify which exception prevails. L-4.3 sets the credit to 50%;
  L-4.4 sets it to 0%. The conflict allows the customer to argue for the 50% credit, as L-4.3
  is a specific exception to the cap that also defines the credit amount, while L-4.4 is an
  exception only to L-4.1. The ambiguity favors the customer in maximizing the credit.
