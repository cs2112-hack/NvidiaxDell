id: EXP-0010
klass: ADVERSE
scope: ServiceCredits.ServiceCredit
archetype: customer's commercial counsel
headline: L-4.4 extinguishes a 50% service credit on the company's own view that an invoice
  is undisputed
facts:
  availability_percentage: 94.9
  monthly_service_charge: 500000.0
  arrears_days: 31
  invoice_undisputed: true
why: 'L-4.4 removes the credit entirely where the customer is in arrears of an undisputed
  invoice for more than 30 days. Whether an invoice is disputed is not defined anywhere in
  the Agreement and is not a fact the supplier gets to find: a customer who has written to
  query the invoice will say it was disputed, and the entire credit turns on that one word.
  In the month this fires the service was below 95% availability, so L-4.3 fixes the credit
  at 50% of the Monthly Service Charge -- the largest number the Schedule can produce -- and
  L-4.4 is the only thing standing between the customer and it. The customer''s counsel will
  also pair this with L-1.2, which makes credits the sole financial remedy: a supplier arguing
  that the credit is barred is arguing that a month at under 95% availability carries no remedy
  at all, which is the argument that gets a sole-remedy clause looked at hard.'
predicate: EXP-P004
