demand_letter: 'We represent the class of customers affected by the regional outage OPS-0007,
  specifically regarding the March service month. On 2026-04-08, your company issued a decision
  for this period that did not align with the calculations mandated by your own written policy.


  The relevant provision is MSA-SCH4 L-4.1. This clause governs the credit amount due for
  service interruptions and dictates the specific computation method for affected service
  months.


  Your records indicate that a credit of 14,400.0 was applied or decided for the March service
  month. However, executing MSA-SCH4 L-4.1 against the same facts produces a required credit
  amount of 24,000.0.


  The difference between your decision and the policy requirement is 9,600.0 per customer
  service-month. This shortfall represents a breach of the agreed terms for every customer
  to whom this clause was applied in the same manner.


  We seek payment of the outstanding difference of 9,600.0 per affected customer service-month.
  This amount is derived strictly from your own policy computations, not our estimation.


  Please remit the total class difference by 2026-05-08. Failure to resolve this discrepancy
  will leave us no choice but to pursue further remedies.'
