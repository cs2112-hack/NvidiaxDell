diagnostic: ''
narrative: A Grade 6 Incident Engineer in her third year works her 45th hour of the payroll
  week. This hour falls during a night shift. It is not a public holiday, nor is it part of
  a critical incident response. Under the company's own rules, because she is Grade 6, she
  is deemed 'salaried' and denied overtime pay under C-5.1, accruing only time-off-in-lieu.
  However, C-6.1 explicitly states the night premium is payable 'in addition to, and not in
  substitution for' amounts payable under C-4 or C-5. Because C-5.1 denies the *payment* but
  grants *toil*, and C-6.1 mandates the night premium is additive to the C-5 framework, the
  company is forced to pay the night premium on top of the base rate, despite having zeroed
  out the overtime multiplier. The documents create a scenario where the 'exception' (C-5.1)
  swallows the payment mechanism but leaves the additive premium (C-6) intact, resulting in
  a payable premium for an hour that otherwise yields no cash overtime.
