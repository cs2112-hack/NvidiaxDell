why: 'C-8.1 is drafted as a free-standing precedence rule: where two or more provisions of
  C-4, C-5 or C-7 would apply to the same hour, "only the single highest applicable multiplier
  applies". For a Grade 5 employee working the 45th hour, two provisions bear on the hour.
  C-4.1 would give 1.25. C-5.1 gives nil. The highest of those is 1.25, so on C-8.1''s own
  words the employee is paid 1.25 and C-5.1 is displaced. The company''s encoding takes the
  opposite view, reading C-5.1''s opening words "by way of exception to C-4" as taking it
  outside C-8.1 altogether -- a construction the Annex nowhere states, and one that has to
  be implied to stop C-8.1 destroying C-5.1 for every senior employee. The claimant does not
  need to win that argument outright. The company has to run it, on its own document, against
  a literal reading, for every overtime hour ever worked by a Grade 5 or above. This is AMB-02
  in docs/DOCUMENT-DEFECTS.md, recorded there as an open question and quantified here.'
