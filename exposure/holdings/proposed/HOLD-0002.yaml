id: HOLD-0002
scope: Overtime.HourPremium
title: Marchetti v Northbank Systems Ltd [2026] EAT 118 (hours beyond 48)
holding: A precedence provision that selects the highest applicable multiplier reaches a
  grade-based exclusion, which confers no multiplier, so the exclusion cannot defeat the
  overtime entitlement. An employee of grade 5 or above is owed the higher overtime rate for
  each hour in excess of 48, unless the exclusion is expressly drafted to operate
  notwithstanding the precedence rule.
when:
- grade >= 5
- ordinal > 48
- multiplier < 1.5
citations:
- 'Marchetti v Northbank Systems Ltd [2026] EAT 118, paras 1-3 and the Disposal: sums due
  at the higher overtime rate for hours in excess of 48, notwithstanding a grade exclusion,
  where a precedence rule selects the single highest applicable multiplier.'
- 'EMP-ANNEX-C C-4.2, C-5.1 and C-8.1: the higher rate, the grade exclusion, and the precedence
  rule the ruling reads together.'
contends_output: multiplier
contends_value: 1.5
source_file: exposure/holdings/incoming/2026-marchetti-v-northbank.md
proposed: '2026-09-12'
status: proposed
